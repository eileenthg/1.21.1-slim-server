plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = "${minecraft_version}-${mod_version}"
group = 'net.eileenthg.tabfolders'
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    def mods = "${System.getenv('APPDATA')}/PrismLauncher/instances/1.21.1 slim/minecraft/mods"
    compileOnly files("${mods}/legendarytabs-1.21.1-2.0.jar")
    compileOnly files("${mods}/jei-1.21.1-neoforge-19.57.0.447.jar")
    compileOnly files("${mods}/curios-neoforge-9.5.1+1.21.1.jar")
}
