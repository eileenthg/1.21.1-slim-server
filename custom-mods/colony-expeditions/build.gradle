plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = 'net.eileenthg.colonyexpeditions'
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

dependencies {
    def packMods = file(project.pack_mods_dir)
    compileOnly fileTree(dir: packMods, include: [
            'minecolonies-*.jar',
            'structurize-*.jar',
            'blockui-*.jar',
            'domum-ornamentum-*.jar'
    ])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
