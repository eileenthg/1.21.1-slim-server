plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = "${minecraft_version}-${mod_version}"
group = 'net.eileenthg.guidelibrary'
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

dependencies {
    // Both are optional at runtime. Every class that names one of their types sits behind a
    // ModList check, so the jar loads fine in a pack that has neither.
    def packMods = file(project.pack_mods_dir)
    compileOnly fileTree(dir: packMods, include: [
            'Patchouli-*.jar',
            'modonomicon-*.jar'
    ])
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
