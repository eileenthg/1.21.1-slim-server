plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = "${minecraft_version}-${mod_version}"
group = 'net.eileenthg.taskcurator'
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly files("${System.getenv('APPDATA')}/PrismLauncher/instances/1.21.1 slim/minecraft/mods/touhoulittlemaid1.5.3neoforgemc1.21.1all.jar")
}
