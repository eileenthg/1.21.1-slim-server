plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = "${minecraft_version}-${mod_version}"
group = 'net.eileenthg.maidchef'
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def mods = "${System.getenv('APPDATA')}/PrismLauncher/instances/1.21.1 slim/minecraft/mods"

dependencies {
    compileOnly files("${mods}/touhoulittlemaid1.5.3neoforgemc1.21.1all.jar")
    compileOnly files("${mods}/FarmersDelight-1.21.1-1.3.4-patched.jar")
    compileOnly files("${mods}/maidsoulkitchen1.21.1betav0.1.3yhc4.2.14.jar")
    compileOnly files("${mods}/extradelight-2.6.6.jar")
    compileOnly files("${mods}/BrewinAndChewinneoforge5.0.01.21.1.jar")
    compileOnly files("${mods}/farmersrespite-1.21.1-3.0.1.jar")
    compileOnly files("${mods}/youkaishomecoming-4.2.14.jar")
    compileOnly files("${mods}/spectrum-1.12.5-1.21.1-neo.jar")
    compileOnly files("${mods}/expandeddelight0.1.4.jar")
    compileOnly files("${mods}/cookingforblockheads-neoforge-1.21.1-21.1.24.jar", "${mods}/balm-neoforge-1.21.1-21.0.65.jar")
    // nested inside the YHC jar; extracted for compiling
    compileOnly fileTree(dir: "libs", include: "*.jar")
}

// ./gradlew build -Prelease: no self-test in the jar
if (project.hasProperty('release')) {
    sourceSets.main.java {
        exclude '**/SelfTest.java'
        exclude '**/SelfTestHook.java'
    }
}
