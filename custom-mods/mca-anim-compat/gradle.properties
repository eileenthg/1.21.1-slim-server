mod_description=Fixes so player animations survive MCA's custom player models: whole-body animation offsets (Take a Seat's sit drop) and Take a Seat's sit camera scale with MCA body height, a lying camera for bed poses, and Princess Carry (MCA Romantic Expansion) fixes: the carrier keeps their arms, the carried player lies steadily across them, the carrier can use blocks and waystones, teleports bring the carried player along, and sneak + right-click on a block puts them down. /mcaanimcompat reports what each nearby player is rendered with.
