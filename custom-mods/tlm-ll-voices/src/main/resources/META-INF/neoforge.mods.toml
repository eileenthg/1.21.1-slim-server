modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    authors = "${mod_authors}"
    description = '''
    Love & Loathe maids speak up on their own through chat bubbles: hunger and injuries, mood changes, signs that
    they are drifting toward betrayal, forgetting, doting, devotion or panic, and reactions to the passive trust and
    fear changes. Lines are written by each maid's own LLM character setting (Player2 by default).
    '''

[[mixins]]
    config = "llvoices.mixins.json"

[[dependencies."${mod_id}"]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${minecraft_version},1.21.2)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "touhou_little_maid"
    type = "required"
    versionRange = "[1.5.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "callresponse"
    type = "required"
    versionRange = "[2.0,)"
    ordering = "AFTER"
    side = "BOTH"
