org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mappings — matched to Overgrown's Apoli/Origins so our mixin targets line up exactly.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
neo_version_range=[21.1.0,)
loader_version_range=[4,)

mod_id=touhouorigins
mod_name=Touhou Origins
mod_license=MIT
mod_version=2.0.2
mod_group_id=net.reimaden.touhouorigins
mod_authors=Maxmani
mod_description=Touhou-themed origins for the Origins mod. Ported to NeoForge 1.21.1 against Overgrown's Origins/Apoli.

# --- Dependency coordinates (see NOTES.md "Phase 2") ---
# Apoli comes from mavenLocal, built from reference/og-apoli via publishToMavenLocal.
#
# NOT the Modrinth release (slug "opoli", version id XFigHo5S). That jar calls itself 1.56.0
# but is OLDER than the source HEAD: it lacks IconData/IconRenderer/ExprPeer and its
# ExprVars.ResolvedVar takes 2 args instead of 3. Origins HEAD does not compile against it.
# Apoli and Origins must be built together from source as a matched pair — and Eileen must
# run those same two jars in-game, not the Modrinth Apoli.
apoli_maven_version=1.56.0+1.21.1-neoforge

# Overgrown's Origins is NOT published anywhere — no Maven, no Modrinth, no GitHub release.
# It is built from source into build-deps/ and consumed as a flatDir local jar.
origins_version=1.27.0

# Pehkui, retained solely for bake_danuki/smelly relative visibility scaling (decision D3).
pehkui_version=nKHizsl6
