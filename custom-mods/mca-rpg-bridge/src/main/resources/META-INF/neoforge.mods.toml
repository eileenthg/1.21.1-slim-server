modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "mca"
type = "required"
versionRange = "[7.7,8)"
ordering = "AFTER"
side = "BOTH"

# Every other half is optional: each mixin is skipped when its target mod is absent.
[[dependencies.${mod_id}]]
modId = "mcaquests"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "mcareputation"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "mebahelrpgrquest"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "mcarpgbridge.mixins.json"
