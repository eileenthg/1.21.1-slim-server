plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '1.0.0'
}

version = "${minecraft_version}-${mod_version}"
group = project.mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client { client() }
        server { server() }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    // Compile-only: MCA, MCA: Quests, MCA: Reputation, and Connector's Mojang-mapped copy of Mebahel's RPG Villager Quests.
    compileOnly files('../build/libs/mcarpgbridge-1.21.1-1.0.0.jar', 'libs/mca.jar', 'libs/mcaquests.jar', 'libs/mcareputation.jar', 'libs/mebahel-moj.jar', 'libs/fabric-resource-loader.jar', 'libs/fabric-events-interaction-v0.jar', 'libs/fabric-api-base.jar')
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
