    # Applied ON TOP of the global Apotheosis multiplier.
    # Final value = global_multiplier * attribute_multiplier * base_value
    # Examples:
    #   1.0 = no change (uses global multiplier only)
    #   0.5 = reduce this attribute by 50%
    #   2.0 = double this attribute
    # Default: 1.0; Range: [0.0 ~ 100.0]
    S:multiplier=1.0
}


