#女仆情感被动系统配置
[emotion_passive]
	#是否启用坐姿情感变化调试
	sitDetectionEnabled = true
	#坐下时信任变化值（范围 -10 ~ +10，负值减少信任）
	# Default: -2
	# Range: -10 ~ 10
	sitTrustChange = -2
	#坐下时恐惧变化值（范围 -10 ~ +10，负值减少恐惧）
	# Default: -2
	# Range: -10 ~ 10
	sitFearChange = -2

#流浪女仆事件配置
[wandering_maid]
	#每隔多少分钟尝试触发一次流浪女仆事件（范围 0~60 分钟；0 表示关闭自动触发，指令触发不受影响）
	# Default: 5
	# Range: 0 ~ 60
	spawnIntervalMinutes = 60
	#每次到达触发时间后，实际生成流浪女仆事件的概率（范围 0%~100%）
	# Default: 25
	# Range: 0 ~ 100
	spawnChancePercent = 1
	#每名玩家在一次流浪事件中生成的女仆数量（范围 1~10）
	# Default: 1
	# Range: 1 ~ 10
	maidsPerPlayer = 1
	#流浪女仆死亡掉落与收留赠礼的物品黑名单。填写完整物品 ID，例如 minecraft:bedrock；可无限添加，黑名单优先于白名单
	dropBlacklist = []
	#流浪女仆死亡掉落与收留赠礼的物品白名单。留空时允许所有非黑名单物品；填写后只会随机其中的物品，例如 minecraft:diamond
	dropWhitelist = ["minecraft:cookie", "minecraft:cake", "minecraft:bread", "minecraft:apple", "minecraft:sweet_berries", "minecraft:glow_berries", "minecraft:honey_bottle", "minecraft:sugar", "minecraft:pumpkin_pie", "minecraft:poppy", "minecraft:dandelion", "minecraft:cornflower", "minecraft:azure_bluet", "minecraft:lily_of_the_valley", "minecraft:pink_petals", "minecraft:string", "minecraft:feather", "minecraft:paper", "minecraft:book", "minecraft:white_wool", "minecraft:pink_wool", "minecraft:emerald", "minecraft:gold_nugget", "minecraft:iron_nugget", "minecraft:amethyst_shard", "youkaishomecoming:tea_leaves", "youkaishomecoming:black_tea", "extradelight:sugar_cookie", "farmersdelight:sweet_berry_cookie", "farmersdelight:honey_cookie"]

#流浪商人女仆交易配置
[wandering_trader_maid_trade]
	#整套流浪商人女仆交易的总开关。关闭后不生成待售女仆、不添加呼应物品交易，也不显示交易女仆按钮
	enabled = true

#溺爱女仆占有欲配置
[doting_possessive]
	#溺爱女仆多久尝试一次赶走主人身边的其他女仆（范围 0~10 分钟；0 为只要附近有其他女仆就持续追赶）
	# Default: 1
	# Range: 0 ~ 10
	intervalMinutes = 1
	#每次占有欲发作后持续赶走其他女仆的时间（范围 10~120 秒）
	# Default: 20
	# Range: 10 ~ 120
	durationSeconds = 20
