#The stock MineColonies Netherworker.
[netherworker]
	#Item the Netherworker uses up to light the nether portal (replaces flint and steel).
	portal_opener = "dimensional_tears:dimensional_tears_bottle"
	#Opener items used per portal opening. Durability items lose this much durability instead.
	# Default: 1
	# Range: 0 ~ 64
	opener_per_trip = 1
	#Trips allowed per period.
	# Default: 1
	# Range: 0 ~ 100
	trips_per_period = 1
	#Length of the trip period in days.
	# Default: 3
	# Range: 1 ~ 100
	period_days = 3
	#Multiplier on how long the worker stays away.
	# Default: 1.0
	# Range: 0.05 ~ 20.0
	trip_time_multiplier = 1.0
	#Multiplier on damage taken from each encounter.
	# Default: 1.0
	# Range: 0.0 ~ 20.0
	damage_multiplier = 1.0
	#Tool tier the worker must hold before leaving: 0 wood or gold, 1 stone, 2 iron, 3 diamond, 4 netherite.
	#The worker waits and asks the colony for that tier instead of setting off under-equipped.
	# Default: 1
	# Range: 0 ~ 5
	min_tool_level = 1
	#Armour tier the worker must wear before leaving: 0 leather, 1 gold, 2 chain, 3 iron, 4 diamond.
	#-1 requires no armour at all.
	# Default: 0
	# Range: -1 ~ 5
	min_armor_level = 0

	[expeditions.end]
